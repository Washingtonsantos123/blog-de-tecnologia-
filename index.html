<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Vitrine de Ofertas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .produto-card {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }
        .produto-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
        }
        .produto-info {
            flex: 1;
        }
        .produto-info h3 {
            font-size: 15px;
            color: #333;
            margin: 0 0 8px 0;
        }
        .btn-comprar {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-comprar:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Minha Vitrine</h1>
        <p>As melhores ofertas do Mercado Livre e Shopee</p>

        <!-- PRODUTO 1 -->
        <div class="produto-card">
            <img src="COLIQUE_O_LINK_DA_FOTO_AQUI" alt="Produto">
            <div class="produto-info">
                <h3>Nome do Produto Exemplo</h3>
                <a href="COLE_SEU_LINK_DE_AFILIADO_AQUI" target="_blank" class="btn-comprar">Ver Oferta</a>
            </div>
        </div>

        <!-- Você pode copiar o bloco acima (produto-card) para adicionar mais produtos -->

    </div>

</body>
</html>
